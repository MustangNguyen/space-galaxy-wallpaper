<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Particles Galaxy</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; cursor: none; }
    #black-hole {
      position: fixed; width: 30px; height: 30px; border-radius: 50%;
      pointer-events: none; opacity: 0; transform: translate(-50%, -50%);
      background: #000; border: 1px solid #ffe2be;
      box-shadow: 0 0 6px 2px #ffa956, 0 0 20px 4px #c45bdf99,
                  0 0 42px 9px #6759ff44;
      z-index: 1;
    }
    #controls { position: fixed; bottom: 16px; left: 16px; z-index: 2;
      display: flex; align-items: center; gap: 12px; padding: 9px 12px;
      border-radius: 10px; background: #080b18bb; color: #c9cbe0;
      font: 12px system-ui; }
    #quality { background: #171b2c; color: #e4e4ed; border: 1px solid #383e58;
      border-radius: 5px; padding: 5px; cursor: pointer; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
<div id="black-hole" aria-hidden="true"></div>
<div id="controls"><label for="quality">Chất lượng</label>
  <select id="quality"><option value="light">Nhẹ</option>
    <option value="balanced" selected>Cân bằng</option></select>
  <span id="status">30 FPS tối đa</span>
</div>
<script type="module" src="./galaxy.mjs"></script>
</body>
</html>
